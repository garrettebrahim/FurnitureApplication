services:
  - type: web
    name: furniture-planner
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -k gthread --threads 4 -b 0.0.0.0:$PORT --timeout 60 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: BASIC_AUTH_USER
        sync: false   # set in dashboard
      - key: BASIC_AUTH_PASS
        sync: false   # set in dashboard
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: SCRAPINGBEE_API_KEY
        sync: false   # optional — set in dashboard to enable residential-proxy scraping
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
