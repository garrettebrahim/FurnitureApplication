<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Furniture Planner{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">Furniture Planner</a>
    <nav>
      <a href="{{ url_for('index') }}">Items</a>
      <a href="{{ url_for('calendar_page') }}">Calendar</a>
      <a href="{{ url_for('pnl_page') }}">P&amp;L</a>
      <a href="{{ url_for('settings_page') }}">Settings</a>
    </nav>
    <div class="spacer"></div>
    {% block topbar_right %}{% endblock %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
